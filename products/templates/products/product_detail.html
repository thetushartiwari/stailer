{% extends 'products/base.html' %}
{% block title %}{{ product.title }} – Stailer{% endblock %}
{% block content %}

<style>
  .detail-container {
    display: grid;
    grid-template-columns: 450px 1fr;
    gap: 40px;
    margin-top: 25px;
    padding: 35px;
    border-radius: 16px;
  }
  
  .detail-img-wrapper {
    width: 100%;
    height: 500px;
    border-radius: 12px;
    overflow: hidden;
    border: 1px solid rgba(255, 255, 255, 0.08);
    background: #111;
  }
  
  .detail-img {
    width: 100%;
    height: 100%;
    object-fit: cover;
  }
  
  .detail-info {
    display: flex;
    flex-direction: column;
    justify-content: center;
    gap: 20px;
  }
  
  .detail-brand {
    font-size: 13px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 1.5px;
    color: var(--text-gray);
  }
  
  .detail-title {
    font-family: 'Outfit', sans-serif;
    font-size: 32px;
    font-weight: 800;
    letter-spacing: -0.5px;
    color: var(--text-white);
  }
  
  .detail-price {
    font-size: 26px;
    font-weight: 800;
    color: var(--accent-cyan);
    text-shadow: 0 0 10px rgba(0, 242, 254, 0.15);
  }
  
  .detail-desc {
    font-size: 15px;
    color: var(--text-gray);
    line-height: 1.6;
    margin-top: 10px;
  }
  
  .detail-actions {
    display: flex;
    align-items: center;
    gap: 15px;
    margin-top: 20px;
  }
  
  .detail-cart-btn {
    padding: 14px 35px;
    border-radius: 12px;
    border: none;
    background: linear-gradient(135deg, var(--accent-cyan), #00b8ff);
    color: #050508;
    font-weight: 700;
    font-size: 15px;
    cursor: pointer;
    transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    box-shadow: 0 4px 15px rgba(0, 242, 254, 0.3);
  }
  
  .detail-cart-btn:hover {
    transform: translateY(-1px);
    box-shadow: 0 6px 20px rgba(0, 242, 254, 0.5);
  }
  
  .detail-store-btn {
    padding: 14px 30px;
    border-radius: 12px;
    border: 1px solid rgba(255, 255, 255, 0.12);
    background: rgba(255, 255, 255, 0.03);
    color: white;
    font-weight: 600;
    font-size: 15px;
    cursor: pointer;
    text-decoration: none;
    transition: all 0.3s ease;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  
  .detail-store-btn:hover {
    border-color: var(--accent-gold);
    background: rgba(246, 211, 101, 0.05);
    color: var(--accent-gold);
    box-shadow: 0 0 15px rgba(246, 211, 101, 0.15);
  }
  
  .detail-like-btn {
    width: 48px;
    height: 48px;
    border-radius: 12px;
    border: 1px solid rgba(255, 255, 255, 0.12);
    background: rgba(255, 255, 255, 0.03);
    color: white;
    font-size: 18px;
    cursor: pointer;
    transition: all 0.2s ease;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  
  .detail-like-btn:hover {
    background: var(--accent-magenta);
    border-color: var(--accent-magenta);
    box-shadow: 0 0 15px rgba(255, 8, 68, 0.4);
    transform: scale(1.05);
  }
  
  .detail-dislike-btn:hover {
    background: #333;
    border-color: #333;
    transform: scale(1.05);
  }
  
  /* Recommendations Section */
  .rec-wrapper {
    margin-top: 60px;
  }
  
  .rec-header {
    font-family: 'Outfit', sans-serif;
    font-weight: 800;
    font-size: 22px;
    margin-bottom: 25px;
  }
  
  .rec-grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 20px;
  }
  
  .rec-card {
    border-radius: 12px;
    background: var(--panel-dark);
    border: 1px solid rgba(255, 255, 255, 0.04);
    overflow: hidden;
    transition: all 0.3s ease;
  }
  
  .rec-card:hover {
    transform: translateY(-3px);
    border-color: rgba(0, 242, 254, 0.2);
    box-shadow: 0 8px 24px rgba(0,0,0,0.4);
  }
  
  .rec-img-container {
    width: 100%;
    height: 200px;
    background: #111;
  }
  
  .rec-img {
    width: 100%;
    height: 100%;
    object-fit: cover;
  }
  
  .rec-info {
    padding: 15px;
  }
  
  .rec-title {
    font-family: 'Outfit', sans-serif;
    font-size: 14px;
    font-weight: 600;
    color: var(--text-white);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    margin-bottom: 5px;
  }
  
  .rec-price {
    font-size: 14px;
    font-weight: 700;
    color: var(--accent-cyan);
  }
</style>

<div class="glass-panel detail-container">
  <div class="detail-img-wrapper">
    <img class="detail-img" src="{{ product.image_url }}" alt="{{ product.title }}">
  </div>
  
  <div class="detail-info">
    <div class="detail-brand">Premium Apparel</div>
    <h1 class="detail-title">{{ product.title }}</h1>
    <div class="detail-price">₹{{ product.price|floatformat:0 }}</div>
    <p class="detail-desc">{{ product.description }}</p>
    
    <div class="detail-actions">
      <button class="detail-cart-btn" onclick="addToCart({{ product.id }})">Add to Styling Cart</button>
      <a href="{{ product.product_url }}" target="_blank" class="detail-store-btn">
        Buy on Myntra Store ↗
      </a>
      <button class="detail-like-btn" onclick="toggleLike({{ product.id }}, true)" title="Like & save to Style DNA">❤️</button>
      <button class="detail-like-btn detail-dislike-btn" onclick="toggleLike({{ product.id }}, false)" title="Dislike & avoid">💔</button>
    </div>
  </div>
</div>

<div class="rec-wrapper" id="rec-section" style="display:none;">
  <h2 class="rec-header" id="rec-title">❤️ You Might Also Like...</h2>
  <div class="rec-grid" id="rec-grid"></div>
</div>

<script>
// Automatically retrieve standard recommendations on detail page load
document.addEventListener("DOMContentLoaded", () => {
  fetchRecommendations(true);
});

function fetchRecommendations(liked) {
  const productId = {{ product.id }};
  const formData = new FormData();
  formData.append('liked', liked);
  
  fetch(`/get-recommendations/${productId}/`, {
    method: "POST",
    body: formData
  })
  .then(res => res.json())
  .then(data => {
    if (data.success && data.recommendations.length > 0) {
      const recSection = document.getElementById("rec-section");
      const recTitle = document.getElementById("rec-title");
      const grid = document.getElementById("rec-grid");
      
      recSection.style.display = "block";
      recTitle.innerText = liked ? "❤️ You Might Also Like..." : "💔 Try a Different Vibe";
      grid.innerHTML = "";
      
      data.recommendations.forEach(r => {
        grid.innerHTML += `
          <div class="rec-card">
            <a href="/product/${r.id}/" style="text-decoration:none;">
              <div class="rec-img-container">
                <img class="rec-img" src="${r.image_url}" alt="${r.title}">
              </div>
              <div class="rec-info">
                <div class="rec-title" title="${r.title}">${r.title}</div>
                <div class="rec-price">₹${Math.round(r.price)}</div>
              </div>
            </a>
          </div>`;
      });
    }
  });
}

function toggleLike(productId, liked) {
  const formData = new FormData();
  formData.append('liked', liked);
  
  fetch(`/toggle-like/${productId}/`, {
    method: "POST",
    body: formData
  })
  .then(res => res.json())
  .then(data => {
    if (data.success) {
      // Reload recommendation items with this liked preference focus
      fetchRecommendations(liked);
    }
  });
}

function addToCart(productId) {
  const btn = document.querySelector('.detail-cart-btn');
  btn.innerText = "Added to Cart ✓";
  btn.style.background = "#38ef7d";
  btn.style.boxShadow = "0 0 15px rgba(56, 239, 125, 0.4)";
  
  fetch(`/cart/add/${productId}/`, {
    method: "POST"
  })
  .then(res => res.json())
  .then(data => {
    if (data.success) {
      document.getElementById('cart-count').textContent = data.cart_count;
      setTimeout(() => {
        btn.innerText = "Add to Styling Cart";
        btn.style.background = "linear-gradient(135deg, var(--accent-cyan), #00b8ff)";
        btn.style.boxShadow = "0 4px 15px rgba(0, 242, 254, 0.3)";
      }, 1500);
    }
  });
}
</script>

{% endblock %}
